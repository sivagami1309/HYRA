<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HYRA - Climate Hazard Risk Analysis</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #102a43;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            margin-bottom: 25px;
            color: #555;
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        #location {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        #location:focus {
            border-color: #1976d2;
        }

        #checkRisk {
            padding: 15px 25px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        #checkRisk:hover {
            background: #125ca3;
        }

        #checkRisk:disabled {
            background: #888;
            cursor: not-allowed;
        }

        #hyraOutput {
            margin-top: 30px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .input-group {
                flex-direction: column;
            }

            #checkRisk {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>HYRA</h1>
        <p>Hybrid Climate Hazard Risk Analysis & Forecasting System</p>
    </header>

    <main class="container">

        <div class="card">

            <h2>🌍 Hazard Risk Analysis</h2>

            <p>
                Enter a location to analyze real-world environmental
                conditions and estimate flood and landslide risk.
            </p>

            <div class="input-group">

                <input
                    type="text"
                    id="location"
                    placeholder="Example: Kodaikanal"
                    required
                >

                <!-- IMPORTANT: id="checkRisk" -->
                <button
                    id="checkRisk"
                    type="button"
                >
                    CHECK RISK
                </button>

            </div>

            <!-- Prediction results will appear here -->
            <div id="hyraOutput"></div>

        </div>

    </main>

    <footer>
        HYRA © 2026 | Climate Hazard Risk Analysis
    </footer>

    <script src="script.js"></script>

</body>

</html>
